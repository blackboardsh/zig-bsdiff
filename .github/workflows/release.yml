name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0 or v0.1.0-beta.1)'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            zig-target: aarch64-macos
          - os: macos-15-intel
            platform: darwin
            arch: x64
            zig-target: x86_64-macos
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            zig-target: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            zig-target: aarch64-linux
          - os: windows-2025
            platform: win32
            arch: x64
            zig-target: x86_64-windows
            bspatch-target: x86_64-windows-msvc
          - os: windows-2025
            platform: win32
            arch: arm64
            zig-target: aarch64-windows-msvc
            bspatch-target: aarch64-windows-msvc
            cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      # mlugg/setup-zig is the maintained successor to goto-bus-stop/setup-zig
      # and understands the 0.14+ ziglang.org archive naming
      # (zig-<arch>-<os>-<version>).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup MSVC on Windows
        if: matrix.platform == 'win32'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # libsais is now compiled by `zig cc` inside scripts/setup.js, so MinGW
      # is no longer needed on Windows. (Previously `choco install mingw` was
      # required to provide gcc; that toolchain was producing post-baseline
      # instructions that crashed on some Intel CPUs and ARM64 emulation.)

      - name: Setup dependencies
        run: |
          node scripts/setup.js --target=${{ matrix.zig-target }}

      - name: Build binaries
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig-target }} -Dcpu=baseline

      - name: Rebuild bspatch with MSVC ABI (Windows)
        if: matrix.platform == 'win32'
        run: |
          zig build bspatch-only -Doptimize=ReleaseFast -Dtarget=${{ matrix.bspatch-target }} -Dcpu=baseline

      - name: Test build target selection
        run: node --test scripts/build-target.test.js

      - name: Test
        if: matrix.cross != true
        run: |
          zig build test -Dtarget=${{ matrix.zig-target }}

      - name: Build ARM64 tests
        if: matrix.cross == true
        run: zig build test-build -Dtarget=${{ matrix.zig-target }}

      - name: Upload ARM64 tests
        if: matrix.cross == true
        uses: actions/upload-artifact@v4
        with:
          name: arm64-tests-zig-bsdiff
          path: zig-out/bin/test.exe
          if-no-files-found: error

      - name: Package binaries
        run: |
          node scripts/package-binaries.js

      - name: Create tarball
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.platform }}" = "win32" ]; then
            tar -czf ../zig-bsdiff-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz bsdiff.exe bspatch.exe
          else
            tar -czf ../zig-bsdiff-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz bsdiff bspatch
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-bsdiff-${{ matrix.platform }}-${{ matrix.arch }}
          path: zig-bsdiff-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  test-windows-arm64:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: arm64-tests-zig-bsdiff
          path: arm64-tests
      - uses: actions/download-artifact@v4
        with:
          name: zig-bsdiff-win32-arm64
          path: arm64-release
      - name: Run ARM64 tests and packaged CLIs
        shell: pwsh
        run: |
          & ./arm64-tests/test.exe
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 unit tests failed' }
          tar -xzf arm64-release/zig-bsdiff-win32-arm64.tar.gz -C arm64-release
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 archive extraction failed' }
          node scripts/test-release-binaries.js arm64-release arm64
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 release smoke test failed' }

  release:
    if: github.event_name != 'pull_request'
    needs: [build, test-windows-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: zig-bsdiff-*
          path: artifacts

      - name: Publish immutable release to R2
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/upload-release-r2.js --artifacts=artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease || contains(github.ref_name, '-beta') || contains(github.event.inputs.tag, '-beta') }}
          body: |
            zig-bsdiff release

            Pre-built binaries for:
            - **macOS** (arm64 & x64): `zig-bsdiff-darwin-[arch].tar.gz`
            - **Linux** (x64 & arm64): `zig-bsdiff-linux-[arch].tar.gz`
            - **Windows** (x64 & arm64): `zig-bsdiff-win32-[arch].tar.gz`

            ## Usage

            Download the appropriate tarball for your platform and extract:
            ```bash
            tar -xzf zig-bsdiff-darwin-arm64.tar.gz
            ./bsdiff old_file new_file patch_file --use-zstd
            ./bspatch old_file new_file patch_file
            ```
