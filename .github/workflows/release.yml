name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0 or v0.1.0-beta.1)'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            zig-target: aarch64-macos
          - os: macos-15-intel
            platform: darwin
            arch: x64
            zig-target: x86_64-macos
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            zig-target: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            zig-target: aarch64-linux
          - os: windows-2025
            platform: win32
            arch: x64
            zig-target: x86_64-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup MSVC on Windows
        if: matrix.platform == 'win32'
        uses: ilammy/msvc-dev-cmd@v1

      # libsais is now compiled by `zig cc` inside scripts/setup.js, so MinGW
      # is no longer needed on Windows. (Previously `choco install mingw` was
      # required to provide gcc; that toolchain was producing post-baseline
      # instructions that crashed on some Intel CPUs and ARM64 emulation.)

      - name: Setup dependencies
        run: |
          node scripts/setup.js

      - name: Build binaries
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig-target }} -Dcpu=baseline

      - name: Rebuild bspatch with MSVC ABI (Windows)
        if: matrix.platform == 'win32'
        run: |
          zig build bspatch-only -Doptimize=ReleaseFast -Dtarget=x86_64-windows-msvc

      - name: Test
        run: |
          zig build test

      - name: Package binaries
        run: |
          node scripts/package-binaries.js

      - name: Create tarball
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.platform }}" = "win32" ]; then
            tar -czf ../zig-bsdiff-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz bsdiff.exe bspatch.exe
          else
            tar -czf ../zig-bsdiff-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz bsdiff bspatch
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-bsdiff-${{ matrix.platform }}-${{ matrix.arch }}
          path: zig-bsdiff-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish immutable release to R2
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/upload-release-r2.js --artifacts=artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease || contains(github.ref_name, '-beta') || contains(github.event.inputs.tag, '-beta') }}
          body: |
            zig-bsdiff release

            Pre-built binaries for:
            - **macOS** (arm64 & x64): `zig-bsdiff-darwin-[arch].tar.gz`
            - **Linux** (x64 & arm64): `zig-bsdiff-linux-[arch].tar.gz`
            - **Windows** (x64): `zig-bsdiff-win32-x64.tar.gz`

            ## Usage

            Download the appropriate tarball for your platform and extract:
            ```bash
            tar -xzf zig-bsdiff-darwin-arm64.tar.gz
            ./bsdiff old_file new_file patch_file --use-zstd
            ./bspatch old_file new_file patch_file
            ```
